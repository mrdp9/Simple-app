apiVersion: v1
kind: Pod
metadata:
  name: dataservice
  labels:
    app.kubernetes.io/name: dataservice
spec:
  containers:
  - name: dataservice
    image: dataservice:v1
    imagePullPolicy: Never

    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
    ports:
    - containerPort: 8000
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 3
      periodSeconds: 3
